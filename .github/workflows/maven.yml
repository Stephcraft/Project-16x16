name: CI and build exe with Maven

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    - name: Test with Maven
      run: mvn -B test --file pom.xml
    # JavaFX picks its native classifier from the build OS; force Windows natives for the exe
    - name: Build exe with Maven
      run: mvn -B -Pexe -Djavafx.platform=win -DskipTests package --file pom.xml
    - name: Upload .exe artifact
      uses: actions/upload-artifact@v4
      with:
        name: Project16x16.exe
        path: target/*.exe
